<!DOCTYPE html>
<html>

<head>

<title>cleAIra Login</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="navbar">
    cleAIra
</div>

<div class="login-page">

<div class="login-card">

<h2>Sign in</h2>
<p class="subtitle">AI-Based Legal Document Review</p>

{% if error %}
<div class="login-error">{{ error }}</div>
{% endif %}

<form method="POST">

<label for="username">Username or email</label>
<input
id="username"
type="text"
name="username"
value="{{ login_value }}"
required
autocomplete="username"
>

<label for="password">Password</label>
<input
id="password"
type="password"
name="password"
required
autocomplete="current-password"
>

<button class="submit" type="submit">
Login
</button>

</form>

<p class="auth-switch">
New here?
<a href="/register">Create an account</a>
</p>

</div>

</div>

</body>
</html>
